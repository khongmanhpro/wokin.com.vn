# Host nginx (outside Docker) in front of the WOKIN containers. Copy to /etc/nginx/sites-available/wokin,
# adjust certificate paths, enable, then: nginx -t && systemctl reload nginx
# Certificates: certbot --nginx -d wokin.vn -d www.wokin.vn -d admin.wokin.vn  (or keep your existing ones / Cloudflare)

server {
  listen 80;
  server_name wokin.vn www.wokin.vn admin.wokin.vn;
  return 301 https://$host$request_uri;
}

# www → non-www (one canonical host for SEO)
server {
  listen 443 ssl http2;
  server_name www.wokin.vn;
  ssl_certificate     /etc/letsencrypt/live/wokin.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wokin.vn/privkey.pem;
  return 301 https://wokin.vn$request_uri;
}

server {
  listen 443 ssl http2;
  server_name wokin.vn;
  ssl_certificate     /etc/letsencrypt/live/wokin.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wokin.vn/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.wokin.vn;
  ssl_certificate     /etc/letsencrypt/live/wokin.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/wokin.vn/privkey.pem;

  client_max_body_size 20m;   # image uploads (admin allows up to 10 MB)

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
