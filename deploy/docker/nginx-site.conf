# Static website (wokin.vn) served from the folder the admin's "Xuất bản website" writes.
# /srv/site/current is a symlink to releases/<id>; switching it is atomic, so no reload is needed.
# HTTPS and the www → non-www redirect live on the host's reverse proxy (deploy/docker/host-nginx.example.conf).
server {
  listen 80;
  server_name _;
  root /srv/site/current;
  index index.html;

  # Follow the release symlink on every request instead of caching the old target.
  disable_symlinks off;
  open_file_cache off;

  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://admin.wokin.vn; frame-src 'none'" always;

  # Old WordPress pages (same as deploy/hostinger/.htaccess).
  location ~ ^/about/?$ { return 301 /gioi-thieu/; }
  location ~ ^/contact/?$ { return 301 /lien-he/; }
  location ~ ^/distributors/?$ { return 301 /nha-phan-phoi/; }

  # Content-hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /images/ {
    expires 30d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    # Pages are folders with index.html (trailingSlash export); HTML must revalidate after each publish.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://admin.wokin.vn; frame-src 'none'" always;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
