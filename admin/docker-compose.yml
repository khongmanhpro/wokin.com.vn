services:
  postgres:
    image: postgres:16.6-alpine
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: wokin_payload
      POSTGRES_USER: wokin_payload
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for this local-only database}"
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wokin_payload -d wokin_payload"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    volumes:
      - wokin_payload_pgdata:/var/lib/postgresql/data

volumes:
  wokin_payload_pgdata:
