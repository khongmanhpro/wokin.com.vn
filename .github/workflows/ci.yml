name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce High and Critical audit policy
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Validate source catalog
        run: npm run validate:data

      - name: Check generated catalog data
        run: npm run check:data

      - name: Build static export
        run: npm run build

      - name: Validate static export
        run: npm run validate:export

      - name: Package Hostinger release
        run: npm run package:release

      - name: Upload validated static export
        uses: actions/upload-artifact@v7
        with:
          name: wokin-static-export-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Hostinger release pack
        uses: actions/upload-artifact@v7
        with:
          name: wokin-hostinger-release-${{ github.sha }}
          path: |
            release/SHA256SUMS
            release/wokin-hostinger.tar.gz
          if-no-files-found: error
          retention-days: 14
